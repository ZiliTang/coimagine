<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAP 实验研究日志</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f7;color:#192f34;font-family:"Inter","Noto Sans CJK SC",system-ui,sans-serif;line-height:1.65}header{background:#17363d;color:white;border-bottom:4px solid #d58c50}header>div,main{max-width:1180px;margin:auto;padding:1.25rem 2rem}header>div{display:flex;align-items:baseline;gap:1rem;justify-content:space-between}h1{font-size:clamp(1.6rem,4vw,2.5rem);letter-spacing:-.04em;margin:0}header a{color:#d8e8e9}main{display:grid;grid-template-columns:285px minmax(0,1fr);gap:2rem}aside{align-self:start;position:sticky;top:1rem}nav{border-left:2px solid #b5cacc;display:grid;gap:.25rem;margin-top:.7rem}nav button{font:inherit;text-align:left;padding:.42rem .8rem;border:none;background:transparent;color:#315257;cursor:pointer}nav button:hover,nav button.chosen{background:#dbe9e8;color:#075a58}small,#sync,.meta{font-size:.87rem;color:#536a70}#sync{display:block;margin-top:1rem}article{background:white;border:1px solid #c9d6d7;border-top:3px solid #337d7a;border-radius:7px;padding:clamp(1rem,3vw,2rem);margin-bottom:1.4rem;scroll-margin-top:1rem}h2{font-size:1.5rem;line-height:1.4;margin:.35rem 0 1rem}.meta{display:flex;justify-content:space-between;align-items:center}.status{color:#225f5a;font-weight:650}.ongoing{color:#954607}dl{display:grid;grid-template-columns:3.3rem 1fr;gap:.55rem .85rem;margin:0}dt{color:#536a70}dd{margin:0}.phases{background:#f0f5f4;border-radius:5px;padding:.8rem 1rem;margin:1rem 0}.phase{display:grid;grid-template-columns:1fr auto;gap:0 .8rem;margin:.4rem 0}.phase span{font-variant-numeric:tabular-nums}.phase progress{grid-column:1/-1;width:100%;height:.4rem;accent-color:#1f8079}.links{display:flex;flex-wrap:wrap;gap:.5rem 1rem;margin-top:1rem;padding-top:.6rem;border-top:1px solid #e1e8e7}a{color:#126762;text-underline-offset:.2em}select{font:inherit;background:white;border:1px solid #9bb2b5;border-radius:4px;padding:.3rem .55rem}button:focus-visible,a:focus-visible{outline:3px solid #bc731f}#error{color:#953c23}aside label{display:grid;gap:.2rem}@media(max-width:800px){main{display:block}header>div,main{padding:1rem}aside{position:static;margin-bottom:1rem}nav{display:none}article{margin-bottom:1rem}aside label{display:inline-flex;align-items:center;gap:.5rem}}
</style><header><div><h1>CAP 实验研究日志</h1><a href="/">开发监测面板</a></div></header>
<main><aside><label>显示记录 <select id="filter"><option>全部尝试</option><option>进行中</option><option>已完成</option></select></label><nav id="nav" aria-label="按研究顺序"></nav><span id="sync">正在读取本机实验记录…</span><p id="error" role="status"></p></aside><section id="cards" aria-label="实验记录"></section></main>
<script>
const $=s=>document.querySelector(s), el=(tag,txt,cls)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n};
let entries=[],signature='',initial=true;
function render(force=false){let filtered=entries.filter(e=>$('#filter').value==='全部尝试'||($('#filter').value==='已完成')===(e.status==='已完成'));
const key=JSON.stringify(filtered);if(key===signature&&!force)return;signature=key;
const nav=$('#nav'),cards=$('#cards');nav.replaceChildren();cards.replaceChildren();
for(const e of filtered){const btn=el('button',e.title);btn.onclick=()=>{location.hash=e.id;document.getElementById(e.id).scrollIntoView()};nav.append(btn);
const card=el('article');card.id=e.id;const meta=el('div',undefined,'meta');meta.append(el('span',e.date),el('span',e.status,'status '+(e.status==='已完成'?'':'ongoing')));card.append(meta,el('h2',e.title));
const dl=el('dl');for(const [key,title] of [['motivation','动机'],['goal','目标'],['result','结果'],['analysis','分析']])if(e[key])dl.append(el('dt',title),el('dd',e[key]));card.append(dl);
if(e.phases.length){const p=el('div',undefined,'phases');for(const [title,n,max] of e.phases){const row=el('div',undefined,'phase'),bar=el('progress');bar.value=n;bar.max=max;bar.setAttribute('aria-label',title);row.append(el('span',title),el('span',n+' / '+max),bar);p.append(row)}card.append(p)}
if(e.links.length){const links=el('div',undefined,'links');for(const l of e.links){const a=el('a',l.title);a.href=l.url;links.append(a)}card.append(links)}cards.append(card)}
if(!filtered.length)cards.append(el('p','当前没有符合条件的实验。'));
if(initial){initial=false;const id=location.hash.slice(1)||entries.find(e=>e.status!=='已完成')?.id||entries.at(-1)?.id;if(id)requestAnimationFrame(()=>document.getElementById(id)?.scrollIntoView())}}
async function refresh(){try{const r=await fetch('/research-journal-data',{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();entries=d.entries;render();$('#sync').textContent='每 5 秒刷新 · '+new Date(d.updated*1000).toLocaleTimeString('zh-CN');$('#error').textContent=''}catch(e){$('#error').textContent='无法读取最新进度，保留上次数据。'}finally{setTimeout(refresh,5000)}}$('#filter').onchange=()=>render(true);refresh()
</script></html>
