[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coimagine"
version = "0.1.0"
description = "2D protocol core: private contact beliefs, finite-bit messages, exact oracles"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "CoImagine contributors"}]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "pymunk==6.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The deterministic-grid learning baseline needs PyTorch. Install the CPU wheel with
#   pip install -e '.[deterministic-grid]' --extra-index-url https://download.pytorch.org/whl/cpu
deterministic-grid = ["torch>=2.0"]

[project.scripts]
coimagine-2d = "coimagine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = ["_old", ".venv", "build", "dist"]
# The host's ROS iron site-packages register pytest11 plugins
# (launch_testing / launch_ros) that fail to import when `lark` is absent.
# They are unrelated to this project, so block them explicitly.
addopts = "-q -p no:launch_testing -p no:launch_ros"
markers = ["slow: long-running end-to-end tests"]
