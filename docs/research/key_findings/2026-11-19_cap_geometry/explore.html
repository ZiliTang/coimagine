 styles.sort((a,b)=>Number(a.hit)-Number(b.hit));

 c.globalAlpha=1;c.lineWidth=2;circle(c,...points[idx],9,null,'#14242e');

 const r=data[idx], f=r.f;el('roomid').textContent=r.id;el('result').innerHTML=caps.map((cap,k)=>'<span style="color:'+colors[k]+'">'+cap+(r.y[k]?' ✓':' ×')+'</span>').join('　');

 function rect(x,y,a,w,h,color,heading){g.save();g.translate(x,y);g.rotate(a);g.fillStyle=color;g.fillRect(-w/2,-h/2,w,h);g.strokeStyle='#3a4a4d';g.strokeRect(-w/2,-h/2,w,h);if(heading){g.strokeStyle='white';g.beginPath();g.moveTo(0,0);g.lineTo(w/2,0);g.stroke()}g.restore()}
