@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><h1>同前缀的两个真实后继</h1>
<p>每类最多取两个不同新房间，按起点到物理簇中心的距离挑选。两面板共享时钟，位置取最近一次已记录的命令边界。轮廓标出分叉时的物体与障碍物，后续只显示目标物中心与两机器人位置。边界间的连线仅辅助阅读。</p>
