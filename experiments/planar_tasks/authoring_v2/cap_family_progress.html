<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAP 场景增广实验</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f3f4ee;color:#162a29;font:16px/1.55 "IBM Plex Sans","Noto Sans SC",sans-serif}main{max-width:940px;margin:5vh auto;padding:24px}h1{font-size:clamp(2rem,5vw,3.5rem);letter-spacing:-.05em;margin:0}h2{font-size:1.35rem;margin:6px 0}section,article{background:#fff;border:1px solid #d4dbd1;border-radius:12px;padding:22px}header{margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px;margin:16px 0}b.big{font:600 2.8rem/1.2 "IBM Plex Mono",monospace;color:#016c58}progress{width:100%;height:11px;accent-color:#007660}p{margin:8px 0}small,time{color:#4b615b}table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid #e2e7de;text-align:left}#error{color:#982e20;white-space:pre-wrap}a{color:#006655}
</style><main><header><h1>CAP 场景增广实验</h1><p id="status">读取进度中…</p><small>每 5 秒刷新 · 最近更新 <time id="at">—</time><span id="speed"></span></small></header><div class="cards" id="cards"></div><section><h2>实验进度</h2><table><thead><tr><th>阶段</th><th>已完成 / 计划</th></tr></thead><tbody id="phases"></tbody></table><p id="detail"></p><p id="error"></p><a id="inventory" href="collection.csv" hidden>下载逐轨迹采集结果</a> <a id="report" href="report.html" hidden>查看最终结果</a></section></main>
<script>
const text=(id,x)=>document.getElementById(id).textContent=x;
const names={uniform:'普通增广',targeted:'定向增广'};
function show(s){text('status',s.stage);text('at',new Date(s.time*1000).toLocaleTimeString());const runs=Object.values(s.arms||{}).reduce((a,v)=>a+v.runs,0);const elapsed=s.time-s.collection_start;const rate=runs*60/elapsed;text('speed',s.stage==='采集并提取轨迹特征'&&elapsed>15?' · 平均 '+rate.toFixed(0)+' 次执行/分钟':'');let cards=document.getElementById('cards');cards.replaceChildren();for(let [k,v] of Object.entries(s.arms||{})){let a=document.createElement('article');a.innerHTML='<h2></h2><p><b class="big"></b> 条成功轨迹</p><progress max="201"></progress><p class="count"></p><small></small>';a.querySelector('h2').textContent=names[k];a.querySelector('b').textContent=v.success;a.querySelector('progress').value=v.success;a.querySelector('.count').textContent='完成 '+v.runs+' 次执行 · '+v.families+' 个基础场景 · 含原数据共 '+(4256+v.runs).toLocaleString()+' 条轨迹';a.querySelector('small').textContent=v.distinct==null?'目标：每组至少 201 条不同的成功动作序列':'完整动作序列去重后 '+v.distinct+' 条';cards.append(a)}let table=document.getElementById('phases');table.replaceChildren();for(let [k,v] of Object.entries(s.phases||{})){let r=table.insertRow();r.insertCell().textContent=k;r.insertCell().textContent=v}text('detail',s.detail||'');text('error',s.error||'');document.getElementById('report').hidden=!s.finished;document.getElementById('inventory').hidden=!s.collection_csv}
async function tick(){try{const r=await fetch('state.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);show(await r.json())}catch(e){text('error','读取进度失败，稍后重试。')}}tick();setInterval(tick,5000)
</script></html>
