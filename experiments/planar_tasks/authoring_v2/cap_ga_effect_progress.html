<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GA-Q 动作后果对照</title>
<style>*{box-sizing:border-box}body{max-width:950px;margin:4vh auto;padding:0 22px;font:16px/1.5 "Source Sans 3",system-ui,sans-serif;background:#f4f5f1;color:#18251e}h1{font-size:clamp(25px,5vw,40px)}h2{font-size:20px;margin-bottom:6px}section{background:white;padding:18px 24px;border:1px solid #d2d9d3;margin:14px 0;border-radius:8px}progress{width:100%;accent-color:#177452}small{color:#4e5b54}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:6px;border-bottom:1px solid #eee}figure{margin:14px 0}canvas{width:100%;height:115px}p{margin:4px 0}code{font-size:13px}</style>
<h1>GA-Q 动作后果对照</h1><p>A 直接评分　·　B 辅助预测　·　C 预测后评分</p><section><h2 id="stage">连接中</h2><p id="detail"></p><small id="time"></small></section><section><h2>实验进度</h2><div id="bars"></div><small id="forks"></small></section><section><h2>训练损失</h2><small>A 蓝　B 橙　C 绿。横轴为更新步，纵轴为批次平均损失。</small><figure>Q 均方误差<canvas id="q"></canvas></figure><figure>后果预测标准化均方误差<canvas id="effect"></canvas></figure><small id="latest"></small></section><section id="results" hidden><h2>最终统计</h2><pre id="final" style="white-space:pre-wrap"></pre></section>
<script>
const $=id=>document.getElementById(id),arms=['A','B','C'],colors=['#3858ad','#b35213','#117553'];
function chart(id,rows){let c=$(id),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=115*devicePixelRatio,g=c.getContext('2d');g.scale(devicePixelRatio,devicePixelRatio);w/=devicePixelRatio;h/=devicePixelRatio;const valid=rows.filter(r=>r[id]!=null);if(!valid.length){g.fillText('等待训练记录',10,45);return}let max=Math.max(.00001,...valid.map(r=>r[id]));g.fillStyle='#555';g.fillText(max.toPrecision(3),1,12);g.fillText('0',20,h-12);g.fillText('0',42,h-1);g.fillText(String(Math.max(...valid.map(r=>r.step))),w-38,h-1);arms.forEach((arm,i)=>{g.beginPath();g.strokeStyle=colors[i];g.lineWidth=2;let j=0;for(const r of valid.filter(r=>r.arm===arm)){let x=45+(w-55)*r.step/Math.max(...valid.map(r=>r.step)),y=8+(h-26)*(1-r[id]/max);if(j++)g.lineTo(x,y);else g.moveTo(x,y);g.fillStyle=colors[i];g.fillRect(x-1,y-1,2,2)}g.stroke()})}
async function poll(){try{const r=await fetch('state.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);const s=await r.json();$('stage').textContent=s.stage;$('detail').textContent=s.detail||'';$('time').textContent='最近写入 '+new Date(s.time*1000).toLocaleString()+' · 每 5 秒刷新';$('bars').replaceChildren();for(const [k,v] of Object.entries(s.tasks||{})){const line=document.createElement('p');line.textContent=k+'　'+v[0]+' / '+v[1];const p=document.createElement('progress');p.value=v[0];p.max=v[1];$('bars').append(line,p)}for(let id of ['q','effect'])chart(id,s.history||[]);const last=(s.history||[]).at(-1);$('latest').textContent=last?'最近记录 '+last.arm+' · '+last.step+' 步 · Q MSE '+last.q.toPrecision(4)+(last.effect!=null?' · 后果 MSE '+last.effect.toPrecision(4):''):'';if(s.result){$('results').hidden=false;$('final').textContent=s.result}}catch(e){$('stage').textContent='无法刷新：'+e}}async function counts(){try{const r=await fetch('counts.json',{cache:'no-store'});if(r.ok){const v=await r.json();$('forks').textContent='已落盘 '+v.rooms+' 个初态 · '+v.prefixes+' 个不同动作分叉边界 · '+v.transitions+' 条候选转移'}}catch(e){}}poll();counts();setInterval(poll,5000);setInterval(counts,5000)
</script></html>
