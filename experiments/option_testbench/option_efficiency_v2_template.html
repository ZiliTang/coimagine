<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Option 效率 v2</title>
<style>*{box-sizing:border-box}body{background:#0b111a;color:#e3ebf5;font:14px/1.6 system-ui;margin:20px}main{max-width:1200px;margin:auto}h1{font-size:22px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;color:inherit;background:#1c2c40;border:1px solid #425873;padding:7px;border-radius:6px}.layout{display:grid;grid-template-columns:2fr 1fr;gap:15px}.card{padding:14px;background:#131e2d;border:1px solid #293b52;border-radius:8px;min-width:0}canvas{width:100%;background:#0c1420}pre{white-space:pre-wrap;font:12px/1.8 monospace}#slider{width:100%}.muted{color:#9aabc0}@media(max-width:750px){.layout{grid-template-columns:1fr}select{max-width:90vw}}</style>
<main><h1>执行效率 v2 · 平滑准备与有意义进展</h1><div class="muted">三组均为120 Hz物理、20 Hz控制、CPU批量扫描。对照旧准备、平滑准备、完整效率配置。新菜单仅保留WAIT[2s]，同伴执行时继续hold；失败不算成功。</div>
<div id="warning" class="muted">__WARNING__</div><div class="controls"><select id="case"></select><select id="variant"></select><button id="r0">机器人 0</button><button id="r1">机器人 1</button><button id="play">播放</button><button id="step">单步</button><button id="restart">重播</button></div>
<div class="layout"><div class="card"><canvas id="world" width="800" height="620"></canvas><input id="slider" type="range" min="0" value="0"><span id="time"></span></div><div class="card"><h3 id="action"></h3><pre id="info"></pre><details><summary>全分支结果</summary><pre id="result"></pre></details></div></div></main>
<script>const DATA=__DATA__;let selected=0,index=0,robot=0,playing=false,last=0;const $=x=>document.getElementById(x),cv=$('world'),ctx=cv.getContext('2d');
const labels={baseline:'原准备 · 65动作',smooth:'平滑准备 · 65动作',efficient:'效率配置 · 62动作'};for(const v of [...new Set(DATA.map(r=>r.variant))]){const o=document.createElement('option');o.value=v;o.textContent=labels[v]||v;$('variant').append(o)}$('variant').value=DATA.some(r=>r.variant==='efficient')?'efficient':$('variant').value;
for(const name of [...new Set(DATA.map(r=>r.case))]){let o=document.createElement('option');o.value=o.textContent=name;$('case').append(o)}
function choose(){selected=DATA.findIndex(r=>r.case===$('case').value&&r.variant===$('variant').value);index=0;draw()}
function draw(){const a=DATA[selected];if(!a)return;const f=a.frames[index],s=f.s[robot],S=Math.min(730/a.instance.arena[0],550/a.instance.arena[1]),xy=(x,y)=>[35+x*S,cv.height-30-y*S];ctx.clearRect(0,0,800,620);ctx.strokeStyle='#20344b';for(let x=0;x<a.instance.arena[0];x+=.5){ctx.beginPath();ctx.moveTo(...xy(x,0));ctx.lineTo(...xy(x,a.instance.arena[1]));ctx.stroke()}for(let y=0;y<a.instance.arena[1];y+=.5){ctx.beginPath();ctx.moveTo(...xy(0,y));ctx.lineTo(...xy(a.instance.arena[0],y));ctx.stroke()}
for(let b of a.instance.obstacles){ctx.save();ctx.translate(...xy(b.cx,b.cy));ctx.rotate(-b.angle);ctx.fillStyle='#76515b';ctx.fillRect(-b.half_w*S,-b.half_h*S,b.half_w*2*S,b.half_h*2*S);ctx.restore()}
ctx.save();ctx.translate(...xy(f.o[0],f.o[1]));ctx.rotate(-f.o[2]);ctx.fillStyle='#aab8cd';ctx.fillRect(-S*.5,-S*.125,S,S*.25);ctx.restore();
for(let i=0;i<2;i++){ctx.beginPath();a.frames.slice(0,index+1).forEach((v,j)=>{let p=xy(...v.r[i]);j?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.strokeStyle=i?'#efa54b':'#4c9add';ctx.lineWidth=2;ctx.stroke();let p=xy(...f.r[i]);ctx.beginPath();ctx.arc(...p,.18*S,0,Math.PI*2);ctx.fillStyle=i?'#efa54b':'#4c9add';ctx.fill();if(i===robot){ctx.beginPath();ctx.arc(...p,.18*S+5,0,Math.PI*2);ctx.strokeStyle='white';ctx.stroke()}ctx.fillStyle='white';ctx.fillText(i,p[0]-4,p[1]+4)}
$('slider').max=a.frames.length-1;$('slider').value=index;$('time').textContent=`绝对时间 ${f.t.toFixed(2)} s · 分支内 ${(f.t-a.frames[0].t).toFixed(2)} s`;$('action').textContent=`机器人 ${robot} · ${s.skill||'冻结边界'}`;
for(const [point,color,fill] of [[s.preferred,'#fcacdb',false],[s.contact_target,'#f472c6',true]]){if(point){ctx.beginPath();ctx.arc(...xy(...point),fill?5:8,0,2*Math.PI);ctx.strokeStyle=color;ctx.fillStyle=color;fill?ctx.fill():ctx.stroke()}}
let gap=Math.hypot(f.r[0][0]-f.r[1][0],f.r[0][1]-f.r[1][1])-.36;
$('info').textContent=`阶段 ${s.stage}\n退出 ${s.exit||(index===a.frames.length-1?a.metric.exits[robot]:null)||'—'}\n步后双机间隙 ${gap.toFixed(4)} m\n物体间隙估计 ${s.gap==null?'—':s.gap.toFixed(3)} m\n接触点分配 ${s.allocation?s.allocation.status:'未介入'}\n法向行程 ${s.travel==null?'—':s.travel.toFixed(3)} / ${s.request??'—'} m\n跟随观测计时 ${s.progress==null?'—':s.progress.toFixed(2)} s\n绑定 PUSH ${s.binding?s.binding.push_robot:'—'}\nPUSH 阶段 ${s.binding?s.binding.push_phase:'—'}\n随 PUSH 运行 ${s.binding?s.binding.during_push_seconds.toFixed(2):'—'} s\n结束通知 ${s.binding?s.binding.stop_reason||'未收到':'—'}\n同伴避让 ${s.guard?s.guard.active:'未介入'}\n施力 ${f.force[robot].map(v=>v.toFixed(2)).join(' / ')} N`;
$('result').textContent=JSON.stringify(a.metric,null,2)}
$('case').onchange=$('variant').onchange=choose;$('r0').onclick=()=>{robot=0;draw()};$('r1').onclick=()=>{robot=1;draw()};$('play').onclick=()=>{playing=!playing};$('step').onclick=()=>{index=Math.min(index+1,DATA[selected].frames.length-1);draw()};$('restart').onclick=()=>{index=0;draw()};$('slider').oninput=()=>{index=+$('slider').value;draw()};
function tick(t){if(playing&&t-last>50){index=Math.min(index+1,DATA[selected].frames.length-1);last=t;draw()}requestAnimationFrame(tick)}$('case').value='push_follow';choose();requestAnimationFrame(tick);</script></html>
