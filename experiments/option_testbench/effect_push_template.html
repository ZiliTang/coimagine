<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoImagine Option 测台</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0c1119;color:#e4eaf4;font:14px/1.5 system-ui,sans-serif}header,.controls,.layout,.legend,.results{max-width:1240px;margin:auto}header{padding:18px 20px 10px}h1{font-size:21px;margin:0 0 4px}.muted{color:#9aabc1;font-size:12px}.protocol-note{margin-top:7px}.protocol-note>div{padding:8px 0;max-width:980px}summary{cursor:pointer;color:#aebed2}button,select{background:#1b293b;color:inherit;border:1px solid #42536d;border-radius:6px;padding:7px 10px;font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #91bdf7;outline-offset:2px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 20px 14px}.controls label{display:flex;gap:6px;align-items:center;font-size:13px}.controls input{min-width:130px;flex:1;max-width:260px}.layout{display:grid;grid-template-columns:minmax(0,800px) minmax(300px,360px);gap:16px;align-items:start;padding:0 20px}.card{background:#121b28;border:1px solid #293448;border-radius:10px;padding:12px;min-width:0}.world-card{padding:10px}canvas{display:block;background:#0b121d;max-width:100%;height:auto}#world{width:100%}.robot-switch{display:flex;gap:6px;margin-bottom:10px}.robot-switch button{flex:1;background:#101a28;border-color:#2c3c52;color:#9cacc1}.robot-switch button[aria-pressed="true"]{background:#20334c;border-color:#4e9ae5;color:#e4f0ff}.robot-switch #robot1[aria-pressed="true"]{background:#3b2c1b;border-color:#efa24c;color:#ffe7c7}.action{font:600 14px/1.5 ui-monospace,monospace;overflow-wrap:anywhere}.status-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}.pill{font-size:12px;border:1px solid #35475f;border-radius:5px;padding:2px 7px}.pill[data-contact="true"]{color:#6fe0ac;border-color:#2d6a53}.pill[data-contact="false"]{color:#dfbe7b}.stage{font-weight:600}.time{font-size:12px;color:#aebed2}.metrics{margin:10px 0;padding:4px 0;border-block:1px solid #293448}.metrics>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:5px 0}.metrics dt{font-size:12px;color:#a8b8cc}.metrics dd{margin:0;font:600 15px ui-monospace,monospace}.tail{font-size:12px;color:#aebed2;margin:8px 0;min-height:18px;overflow-wrap:anywhere}.exit{font-size:12px;margin:8px 0;overflow-wrap:anywhere}#chart{width:100%;margin-top:10px;background:#0e1622}.chart-key{font-size:11px;line-height:1.6;color:#a5b3c8;margin:5px 0 9px}.object-state{font-size:12px;padding-top:9px;border-top:1px solid #293448;color:#afbed1}.advanced{border-top:1px solid #293448;padding-top:9px;margin-top:9px}.advanced pre{white-space:pre-wrap;font:11px/1.7 ui-monospace,monospace;color:#aabbd0;overflow-wrap:anywhere;margin:8px 0 0}.legend{padding:9px 20px;font-size:12px;color:#9aabc1}.results{padding:8px 20px 20px}.table{overflow:auto;padding-top:9px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px 9px;border-bottom:1px solid #293448;text-align:left}tr[data-index]{cursor:pointer}tr[data-index]:hover{background:#1c2b40}.good{color:#56d69a}.bad{color:#f6a36f}[hidden]{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}.inspector{max-width:none}.robot-switch{max-width:360px}#chart{max-width:360px}.controls{gap:8px}h1{font-size:19px}.controls select{max-width:240px}}

<header><h1>联合 Option · 本地调试测台</h1><div id="runstatus" class="muted"></div><details class="protocol-note"><summary>对照说明</summary><div id="comparison_hint" class="muted"></div></details></header>
<div class="controls"><label>类型 <select id="family" aria-label="组合类型"><option value="all">全部场景</option><option value="reposition">含 REPOSITION</option><option value="rp_arc">圆弧换面对照</option><option value="rp_scale_v2">新尺度 REPOSITION</option><option value="rp_detour">同伴外侧绕行</option><option value="rp_wait">换位＋等待</option><option value="rp_push">换位＋推动</option><option value="rp_follow">换位＋跟随</option><option value="rp_pair">双换位</option></select></label><label>场景 <select id="case" aria-label="场景"></select></label><label id="variant-control"><span id="comparison_label"></span><select id="variant" aria-label="对照版本"><option value="true">开启</option><option value="false">关闭</option></select></label><button id="play">暂停</button><button id="step">单步</button><button id="restart">重播</button><label>速度 <select id="speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label><input id="seek" aria-label="回放进度" type="range" min="0" value="0"></div>
<div class="layout"><div class="card world-card"><canvas id="world" width="800" height="640"></canvas></div><aside class="card inspector" aria-label="机器人状态">
<div class="robot-switch" role="group" aria-label="查看机器人"><button id="robot0" aria-pressed="true">机器人 0 · 蓝</button><button id="robot1" aria-pressed="false">机器人 1 · 橙</button></div>
<div id="robot-action" class="action"></div><div class="status-line"><span id="robot-stage" class="stage"></span><span id="frame-time" class="time"></span></div><div class="status-line"><span id="robot-contact" class="pill"></span><span id="robot-gap" class="time"></span></div>
<dl class="metrics"><div><dt id="goal-label">目标</dt><dd id="goal-value"></dd></div><div><dt id="progress-label">当前进度</dt><dd id="progress-value"></dd></div><div id="physical-row"><dt id="physical-label">物体效果</dt><dd id="physical-value"></dd></div></dl>
<div id="tail" class="tail" hidden></div><div id="robot-result" class="exit"></div><canvas id="chart" width="340" height="180" aria-label="所选机器人的目标与进度曲线"></canvas><div id="chart-key" class="chart-key"></div><div id="object-state" class="object-state"></div>
<details id="advanced" class="advanced"><summary>诊断详情</summary><pre id="details"></pre></details></aside></div>
<div class="legend">蓝／橙：机器人 0／1 · 白环：当前查看 · 青：所选可见面 · 粉：所选接触目标 · 金圈：转角参考圆 · 轨迹与物体轮廓为仿真真值</div>
<details class="results"><summary id="results-label">全部结果</summary><div class="table"><table><thead><tr><th>场景</th><th id="comparison_column"></th><th>机器人 0 几何可用</th><th>机器人 0 退出</th><th>机器人 0 目标</th><th>物体效果</th><th>侧偏/m</th><th>转角/°</th><th>离线兑现</th><th>耗时/s</th></tr></thead><tbody id="rows"></tbody></table></div></details>
<script>
const DATA=__DATA__;
const $=id=>document.getElementById(id),cv=$('world'),ctx=cv.getContext('2d'),chart=$('chart'),cc=chart.getContext('2d');
const variant=m=>m.variant??m.feedback,comparison=DATA.comparison_label||'接触点纠偏';
const comparisonNames={reposition_peer_detour:'同伴外侧绕行',reposition_scales_v2:'新换位尺度',reposition_corners:'圆弧换面',joint_recovery:'按间隙联合恢复',post_follow:'完成后接触随动',normal_travel:'实测法向行程',contact_allocation:'同面接触分区',joint_execution:'联合执行协议',fast_approach:'接近加速',endpoint_tracking:'端点跟踪',contact_feedback:'接触点纠偏',option_combinations:'动作组合'};

const labels={'同伴外侧绕行':['外侧绕行','局部排斥'],'圆弧换面':['圆弧过渡','原控制'],'按间隙联合恢复':['联合恢复','失联退出'],'完成后接触随动':['接触随动','原地制动'],'实测法向行程':['本体实测','参考积分']};
$('comparison_label').textContent=comparison;$('comparison_column').textContent='执行配置';
if(labels[comparison])labels[comparison].forEach((name,i)=>$('variant').options[i].textContent=name);
$('comparison_hint').textContent=`同一物理环境与费用；${comparison}成对展示。`+(comparison==='按间隙联合恢复'?'间隙超过10 mm后两侧重接近；都回到3 mm内并连续就绪0.1 s再继续。实际接触与距离内保持分别记录。outward_pulse为预声明外向力扰动诊断。':comparison==='完成后接触随动'?'两组均按本体实测行程推进；完成后分别制动或受限随动，随动路程另记。':comparison==='实测法向行程'?'对比本体实测与参考积分。物体位移单独显示。':'精确配置与原始结果保存在同目录 manifest.json、SUMMARY.md 和 metrics.json。')+' 曲线展示完整回放；光标为当前时刻。估计使用步前观测，真值为步后状态。';

function matchesFamily(r,value){const kinds=r.robot_options.map(o=>o.kind),rp=kinds.filter(k=>k==='reposition').length;return value==='all'||value==='rp_detour'&&r.metric.comparison==='reposition_peer_detour'||value==='rp_scale_v2'&&r.metric.comparison==='reposition_scales_v2'||value==='rp_arc'&&r.metric.comparison==='reposition_corners'||value==='reposition'&&rp>0||value==='rp_pair'&&rp===2||value==='rp_wait'&&rp===1&&kinds.includes('wait')||value==='rp_push'&&rp===1&&kinds.some(k=>['translate','rotate'].includes(k))||value==='rp_follow'&&rp===1&&kinds.includes('follow')}
function updateVariants(){const candidates=DATA.records.filter(r=>r.metric.case===$('case').value),first=candidates[0];if(!first)return;const previous=$('variant').value,versions=[...new Set(candidates.map(r=>String(variant(r.metric))))].sort().reverse(),name=comparisonFor(first);$('variant').replaceChildren();for(const v of versions){const o=document.createElement('option');o.value=v;o.textContent=versions.length===1?'当前配置':labels[name]?.[v==='true'?0:1]||(v==='true'?'开启':'关闭');$('variant').append(o)}$('variant').value=versions.includes(previous)?previous:versions[0];$('variant-control').hidden=versions.length===1;$('comparison_label').textContent=name;}

function choose(){const i=DATA.records.findIndex(r=>r.metric.case===$('case').value&&String(variant(r.metric))===$('variant').value);if(i>=0){selected=i;index=0;accumulated=0;$('seek').max=DATA.records[i].frames.length-1;const name=comparisonFor(DATA.records[i]);$('comparison_hint').textContent=name==='同伴外侧绕行'?'在本侧观测边界与同伴共享位置构成的外侧安全轮廓上绕行，再回到物体边界。两组距离与时间预算相同，额外绕行消耗行程；窄通道若被本侧静态回波阻挡则停止绕行；缺失观测不代表通道畅通。':name==='新换位尺度'?'新菜单采用 0.2 / 0.4 / 0.8 / 1.2 / 1.8 m；使用圆弧边界控制。旧菜单数据按各自冻结的动作参数回放，未重新解释旧 ID。':name==='圆弧换面'?'只切换 REPOSITION 的边界控制。两组保留相同距离、间隙和时间预算；圆弧依据本侧可见线段与可观测端点生成，阴影边界不当作物理角点。':name==='动作组合'?'REPOSITION 与其他 option 的组合覆盖，仅一组当前执行配置。两侧独立计程；提前完成者制动保持。混合组合没有启用仅适用于双 PUSH 的联合接触恢复。':'同一场景的 '+name+' 对照。实际接触、邻近保持与物体位移分别记录。';draw()}}
$('case').onchange=()=>{updateVariants();choose()};$('variant').onchange=choose;$('family').onchange=populateCases;
for(const i of [0,1])$('robot'+i).onclick=()=>{robot=i;draw()};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};
$('step').onclick=()=>{playing=false;$('play').textContent='播放';index=Math.min(index+1,DATA.records[selected].frames.length-1);draw()};
$('restart').onclick=()=>{index=0;accumulated=0;playing=true;$('play').textContent='暂停';draw()};
$('seek').oninput=()=>{index=Number($('seek').value);draw()};
function fmt(v,n=3){return v===null||v===undefined||!Number.isFinite(Number(v))?'—':Number(v).toFixed(n)}
function quantity(v,unit){return v===null||v===undefined?'—':`${fmt(v)} ${unit}`}
function side(f,i){return {...f.robots[i],effect:(i===0?f.effect:f.other_effect)||{}}}
function mode(o){return o.scale_semantics==='measured_normal_travel_m'?'travel':o.scale_semantics==='normal_reference_m'?'clock':o.kind==='rotate'?'angle':'effect'}
const stages={find:'寻找',align:'对齐',move:'沿面换位',approach:'接近',ready:'等待协同',push:'推进',follow:'随动',recover:'联合重接近',brake:'制动',done:'结束',wait:'等待',hold:'保持'};
DATA.records.forEach((r,i)=>{const m=r.metric,tr=document.createElement('tr');tr.dataset.index=i;
 [m.case,['option_combinations','reposition_scales_v2'].includes(m.comparison)?'当前配置':variant(m)?(labels[comparisonFor(r)]?.[0]||'开'):(labels[comparisonFor(r)]?.[1]||'关'),m.available?'是':'否',m.exit,quantity(m.target,m.unit),fmt(m.actual_effect),fmt(m.sideways),fmt(m.rotation_deg,1),m.fulfilled===null?'不适用':m.fulfilled?'是':'否',fmt(m.seconds,2)].forEach((v,j)=>{const td=document.createElement('td');td.textContent=v;if(j===8&&m.fulfilled!==null)td.className=m.fulfilled?'good':'bad';tr.append(td)});
 tr.onclick=()=>{if(!matchesFamily(r,$('family').value)){$('family').value='all';populateCases()}$('case').value=m.case;updateVariants();$('variant').value=String(variant(m));choose()};$('rows').append(tr)});
function xy(x,y){return [40+x*144,600-y*144]}
function line(a,b,color,width=2){ctx.beginPath();ctx.moveTo(...xy(...a));ctx.lineTo(...xy(...b));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function dot(p,color,r=4){if(!p)return;ctx.beginPath();ctx.arc(...xy(...p),r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function arrow(p,d,color,length=.5){const end=[p[0]+d[0]*length,p[1]+d[1]*length];line(p,end,color,2);const a=Math.atan2(d[1],d[0]);line(end,[end[0]-.08*Math.cos(a-.45),end[1]-.08*Math.sin(a-.45)],color);line(end,[end[0]-.08*Math.cos(a+.45),end[1]-.08*Math.sin(a+.45)],color)}
function box(p,opacity=1){const q=xy(p[0],p[1]);ctx.save();ctx.globalAlpha=opacity;ctx.translate(...q);ctx.rotate(-p[2]);ctx.fillStyle='#a5b3c8';ctx.strokeStyle='#e2e8f0';ctx.fillRect(-72,-18,144,36);ctx.strokeRect(-72,-18,144,36);ctx.restore()}
function draw(){if(!DATA.records.length)return;const r=DATA.records[selected],f=r.frames[index],o=r.robot_options[robot],s=side(f,robot),e=s.effect,other=side(f,1-robot).effect;$('seek').value=index;
 for(const i of [0,1])$('robot'+i).setAttribute('aria-pressed',String(robot===i));
 ctx.clearRect(0,0,cv.width,cv.height);for(let x=0;x<=5;x+=.5)line([x,0],[x,4],'#172539',1);for(let y=0;y<=4;y+=.5)line([0,y],[5,y],'#172539',1);line([0,0],[5,0],'#7c8ca4');line([5,0],[5,4],'#7c8ca4');line([5,4],[0,4],'#7c8ca4');line([0,4],[0,0],'#7c8ca4');
 for(const b of r.case.instance.obstacles||[]){ctx.save();ctx.translate(...xy(b.cx,b.cy));ctx.rotate(-b.angle);ctx.fillStyle='#765358';ctx.strokeStyle='#d18787';ctx.fillRect(-b.half_w*144,-b.half_h*144,b.half_w*288,b.half_h*288);ctx.strokeRect(-b.half_w*144,-b.half_h*144,b.half_w*288,b.half_h*288);ctx.restore()}const initial=r.case.instance.object;box([initial.x,initial.y,initial.angle],.2);
 if(o.kind==='reposition'){const b=s.boundary_follow;if(b?.mode==='corner_arc'&&b.point){ctx.beginPath();ctx.arc(...xy(...b.point),b.reference_radius*144,0,Math.PI*2);ctx.strokeStyle='#c99c5755';ctx.lineWidth=1;ctx.stroke();dot(b.point,'#dfb16e',4)}ctx.beginPath();ctx.moveTo(...xy(r.case.instance.robots[robot].x,r.case.instance.robots[robot].y));for(const v of r.frames.slice(0,index+1))ctx.lineTo(...xy(v.r[robot][0],v.r[robot][1]));ctx.strokeStyle=robot?'#efa24c':'#4e9ae5';ctx.lineWidth=2;ctx.stroke();if(s.tangent)arrow(f.r[robot],s.tangent,'#f181cc',.3);const d=s.peer_detour;if(d?.active){ctx.beginPath();ctx.arc(...xy(...d.peer_centre),d.reference_radius*144,0,Math.PI*2);ctx.strokeStyle='#eeb15b99';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);}}
 if(o.kind==='translate')arrow([initial.x,initial.y],o.direction,'#59d697',Math.max(.5,o.target));
 ctx.beginPath();r.frames.slice(0,index+1).forEach((v,j)=>{j?ctx.lineTo(...xy(v.o[0],v.o[1])):ctx.moveTo(...xy(v.o[0],v.o[1]))});ctx.strokeStyle='#679fe5';ctx.lineWidth=2;ctx.stroke();box(f.o);
 f.r.forEach((p,i)=>{dot(p,i===0?'#4e9ae5':'#efa24c',26);arrow(p,[Math.cos(p[2]),Math.sin(p[2])],'#eef5ff',.22);const q=xy(p[0],p[1]);ctx.fillStyle='white';ctx.fillText(String(i),q[0]-4,q[1]+5);if(i===robot){ctx.beginPath();ctx.arc(...q,32,0,Math.PI*2);ctx.strokeStyle='#f0f5ff';ctx.lineWidth=2;ctx.stroke()}});
 const facePoints=e.face_points?.length?e.face_points:s.surface_points;if(facePoints?.length){ctx.beginPath();facePoints.forEach((p,j)=>{j?ctx.lineTo(...xy(...p)):ctx.moveTo(...xy(...p))});ctx.strokeStyle='#4bd6cc';ctx.lineWidth=4;ctx.stroke()}
 dot(e.contact_target,'#f181cc',6);dot(other.contact_target,'#788999',4);dot(e.estimated_centre,e.centre_observable?'#5bdd9e':'#dcbd69',5);
 if(e.face_midpoint&&e.face_normal)arrow(e.face_midpoint,e.face_normal,'#4bd6cc',.22);
 for(const i of [0,1]){const fx=side(f,i).effect,a=fx.same_face,ep=fx.endpoint;ctx.save();ctx.globalAlpha=i===robot?1:.3;
  if(a?.interval&&fx.face_normal&&fx.face_midpoint&&a.status==='allocated'){const n=fx.face_normal,t=[-n[1],n[0]],plane=fx.face_midpoint[0]*n[0]+fx.face_midpoint[1]*n[1];const ends=a.interval.map(q=>[t[0]*q+n[0]*plane,t[1]*q+n[1]*plane]);line(ends[0],ends[1],i?'#efc66b':'#af94ee',6);}
  if(ep){const color=i?'#efc66b':'#5bdd9e';for(const [j,p]of(ep.endpoints||[]).entries())if(p)dot(p,ep.measurements?.[j]?.observed?color:'#6a788d',5);for(const q of ep.measurements||[])if(q.observed&&q.lower&&q.upper)line(q.lower,q.upper,color,3);if(ep.anchor){const q=xy(...ep.anchor);ctx.beginPath();ctx.arc(...q,9,0,Math.PI*2);ctx.strokeStyle='white';ctx.stroke();ctx.fillStyle=color;ctx.fillText(`${i}:${ep.anchor_side}`,q[0]+10,q[1]-8)}}ctx.restore();}
 $('robot-action').textContent=o.label;$('robot-stage').textContent=stages[s.stage]||s.stage;$('frame-time').textContent=`${fmt(f.t,2)} / ${fmt(r.metric.seconds,2)} s`;
 $('robot-contact').textContent=s.contact?'实际接触':'未接触';$('robot-contact').dataset.contact=String(s.contact);$('robot-gap').textContent=`间隙 ${s.gap===null||s.gap===undefined?'—':fmt(s.gap*1000,1)+' mm'}`;
 const m=mode(o);$('goal-label').textContent=m==='angle'?'目标转角':m==='travel'?'主动法向行程目标':m==='clock'?'参考积分目标':o.kind==='reposition'?'换位行程目标':o.kind==='follow'?'跟随维持时间':'请求目标';$('goal-value').textContent=quantity(o.target,o.unit);
 $('progress-label').textContent=(m==='angle'?'本侧角度估计':m==='travel'?'实测主动行程':m==='clock'?'参考积分':o.kind==='reposition'?'有符号沿面行程':o.kind==='follow'?'实际维持时间':o.unit==='s'?'动作执行时间':'当前进度')+(s.estimate_stale&&(m==='angle'||m==='effect')?'（末次）':'');$('progress-value').textContent=quantity(s.progress,o.unit);
 $('physical-row').hidden=!['translate','rotate'].includes(o.kind);$('physical-label').textContent=o.kind==='rotate'?'物体实际转角':'物体沿所选方向位移';$('physical-value').textContent=quantity(s.actual,o.unit);
 const tail=[];if(o.kind==='reposition'){tail.push(`观测换面 ${s.face_switches??0} 次`);if(s.peer_detour?.active)tail.push('同伴外侧绕行');}if(e.follow_started||(s.follow_normal_travel??0)!==0)tail.push(`随动 ${fmt(s.follow_normal_travel)} m`);if((e.recovery_count??0)>0||(s.recovery_normal_travel??0)!==0)tail.push(`恢复 ${fmt(s.recovery_normal_travel)} m`);$('tail').hidden=!tail.length;$('tail').textContent=tail.join(' · ')+(o.kind==='reposition'?'':'（另记）');
 $('robot-result').textContent=s.exit_reason?`退出：${s.exit_reason}`:'执行中';
 const dx=f.o[0]-initial.x,dy=f.o[1]-initial.y;$('object-state').textContent=`当前物体总位移 ${fmt(Math.hypot(dx,dy))} m · 转角 ${fmt((f.o[2]-initial.angle)*180/Math.PI,1)}°`;
 $('details').textContent=[`机器人 ${robot} · ${r.metric.case}`,`记录来源 ${r.source_round||'本轮'}`,`菜单版本 ${r.action_version||DATA.version}`,`状态 ${e.status||s.stage} · 联合阶段 ${f.execution?.phase||'单侧/旧协议'}`,`计程语义 ${o.scale_semantics}`,`边界控制 ${s.boundary_follow?.version||'原控制'} · ${s.boundary_follow?.mode||'—'}`,`静态通道 ${s.static_route_guard?.status||'未触发短程拦截'} · 预测间隙 ${fmt(s.static_route_guard?.swept_return_gap)} m`,`绕行 ${s.peer_detour?.active?'同伴外侧':'物体边界'} · 同伴中心距 ${fmt(s.peer_detour?.centre_distance)} m`,`边界证据 ${s.boundary_follow?.evidence||'—'} · 不确定度 ${fmt(s.boundary_follow?.uncertainty)} m`,`本侧估计时刻 ${fmt(s.estimate_time,2)} s${s.estimate_stale?'（已停止更新）':''}`,`方向误差 ${fmt(e.heading_error)} rad · 侧偏 ${fmt(e.lateral_error)} m`,`切向误差 ${fmt(e.tangential_error)} m · 接触点纠偏 ${fmt(e.offset)} m`,`施力 ${(s.force||[]).map(x=>fmt(x)).join(' / ')} N`,`速度参考 ${(s.reference_velocity||[]).map(x=>fmt(x)).join(' / ')} m/s`,'',`端点 ${e.endpoint_status||'未记录'} · 真实可见端点数 ${e.endpoint?.observed_count??'—'}`,`锚点侧 ${e.endpoint?.anchor_side??'—'} · 距离 ${fmt(e.anchor_distance)} m`,`几何证据 ${e.estimate||'—'} · 年龄 ${fmt(e.geometry_age,2)} s`,`同面分区 ${e.same_face?.status||'未启用'} · 区间 ${(e.same_face?.interval||[]).map(x=>fmt(x)).join(' / ')||'—'}`,`避碰缓冲 ${fmt(e.same_face?.avoidance_margin)} m`,'',`参考积分 ${fmt(s.reference_budget)} m`,`随动 ${fmt(e.follow_seconds,2)} s · 实际接触 ${fmt(e.follow_contact_seconds,2)} s`,`阈值内邻近 ${fmt(e.follow_near_seconds,2)} s`,`恢复 ${e.recovery_count??0} 次 · 请求 ${e.recovery_requested??false} · 就绪 ${e.recovery_ready??false}`,`恢复路程 ${fmt(e.recovery_path_length)} m · 时间 ${fmt(e.recovery_seconds,2)} s`,`扰动 ${r.case.disturbance?JSON.stringify(r.case.disturbance):'无'}`,'','估计为步前观测，物体真值为步后状态；真值只用于离线显示。'].join('\n');

function drawChart(r,o){const kind=mode(o),series=[{color:'#5bdd9e',label:kind==='angle'?'角度估计':kind==='travel'?'主动行程':kind==='clock'?'参考积分':o.kind==='reposition'?'沿面行程':o.kind==='follow'?'维持时间':'进度',values:r.frames.map(f=>side(f,robot).progress)}];if(o.kind==='translate'||o.kind==='rotate')series.push({color:'#679fe5',label:'物体实际',values:r.frames.map(f=>side(f,robot).actual)});
 if(kind==='travel'&&r.frames.some(f=>(side(f,robot).follow_normal_travel??0)!==0))series.push({color:'#efc66b',label:'主动+随动',values:r.frames.map(f=>{const s=side(f,robot);return s.progress===null?null:s.progress+(s.follow_normal_travel??0)})});
 if(kind==='travel'&&r.frames.some(f=>(side(f,robot).recovery_normal_travel??0)!==0))series.push({color:'#b18bea',label:'恢复',values:r.frames.map(f=>side(f,robot).recovery_normal_travel)});
 const values=series.flatMap(s=>s.values).filter(v=>v!==null&&v!==undefined&&Number.isFinite(v)).concat([0,o.target]);let lo=Math.min(...values),hi=Math.max(...values);if(hi-lo<.01)hi=lo+.01;const pad=(hi-lo)*.08;lo-=pad;hi+=pad;const left=38,right=328,top=12,bottom=155,py=v=>bottom-(v-lo)/(hi-lo)*(bottom-top),px=i=>left+i/Math.max(1,r.frames.length-1)*(right-left);
 cc.clearRect(0,0,340,180);cc.strokeStyle='#53647c';cc.lineWidth=1;cc.beginPath();cc.moveTo(left,top);cc.lineTo(left,bottom);cc.lineTo(right,bottom);cc.stroke();cc.font='10px sans-serif';cc.fillStyle='#94a8c1';cc.fillText(fmt(hi,2),1,top+5);cc.fillText(fmt(lo,2),1,bottom);cc.fillText('0 s',left,bottom+16);cc.fillText(fmt(r.metric.seconds,1)+' s',right-32,bottom+16);
 cc.setLineDash([4,4]);cc.strokeStyle='#a6b5c9';cc.beginPath();cc.moveTo(left,py(o.target));cc.lineTo(right,py(o.target));cc.stroke();cc.setLineDash([]);
 for(const s of series){cc.beginPath();let started=false;s.values.forEach((v,i)=>{if(v===null||v===undefined||!Number.isFinite(v)){started=false;return}const p=[px(i),py(v)];started?cc.lineTo(...p):cc.moveTo(...p);started=true});cc.strokeStyle=s.color;cc.lineWidth=1.6;cc.stroke();}
 cc.strokeStyle='#e6a45e';cc.beginPath();cc.moveTo(px(index),top);cc.lineTo(px(index),bottom);cc.stroke();$('chart-key').textContent=`机器人 ${robot} · ${o.unit}｜`+series.map(s=>({'#5bdd9e':'绿','#679fe5':'蓝','#efc66b':'金','#b18bea':'紫'}[s.color])+': '+s.label).join(' · ')+' · 虚线: 所选目标';
}
function tick(time){if(previous&&playing&&DATA.records.length){accumulated+=(time-previous)/1000*Number($('speed').value);const fs=DATA.records[selected].frames;while(index<fs.length-1&&accumulated>=fs[index+1].t-fs[index].t){accumulated-=fs[index+1].t-fs[index].t;index++}draw()}previous=time;requestAnimationFrame(tick)}
$('family').value=DATA.initial_filter||'all';populateCases();requestAnimationFrame(tick);
